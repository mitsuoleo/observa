apiVersion: apps/v1
kind: Deployment
metadata: {name: order, namespace: observa-spike0}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: order}}
  template:
    metadata: {labels: {app: order}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: order
          image: observa-order:dev
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: observa-postgres, key: orders-url}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka:9092}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://collector:4318'}
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 384Mi}
          securityContext: {runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: order, namespace: observa-spike0}
spec:
  selector: {app: order}
  ports: [{name: http, port: 8000, targetPort: http}]
---
