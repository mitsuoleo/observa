rule_files:
  - ../../infra/kubernetes/config/operations-rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="domain",instance="order:8000"}'
        values: '1 0 0 0 1 1'
      - series: 'observa_errors_total{job="domain",service="payment"}'
        values: '0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: ObservaDomainTargetDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ObservaProcessingErrors
        exp_alerts: []
      - eval_time: 3m
        alertname: ObservaDomainTargetDown
        exp_alerts:
          - exp_labels:
              job: domain
              instance: order:8000
              severity: warning
              maturity: experimental
            exp_annotations:
              summary: Domain metrics target is unavailable
              description: Inspect the missing service and follow the target-down procedure in docs/product/operations-runbook.md.
              runbook: docs/product/operations-runbook.md#domain-target-down
      - eval_time: 3m
        alertname: ObservaProcessingErrors
        exp_alerts:
          - exp_labels:
              service: payment
              severity: warning
              maturity: experimental
            exp_annotations:
              summary: Processing errors observed in payment
              description: Inspect logs, trace and retry or parked records using docs/product/operations-runbook.md.
              runbook: docs/product/operations-runbook.md#processing-errors
