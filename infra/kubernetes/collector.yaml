apiVersion: v1
kind: Service
metadata:
  name: collector
spec:
  selector: {app: collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: metrics, port: 8888, targetPort: 8888}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
spec:
  selector:
    matchLabels: {app: collector}
  template:
    metadata:
      labels: {app: collector}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
          args: [--config=/etc/otelcol/config.yaml]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 400m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: 13133}
          livenessProbe:
            httpGet: {path: /, port: 13133}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: logs, mountPath: /var/log/pods, readOnly: true}
            - {name: positions, mountPath: /var/lib/otelcol}
      volumes:
        - name: config
          configMap: {name: collector-config}
        - name: logs
          hostPath: {path: /var/log/pods, type: Directory}
        - name: positions
          hostPath: {path: /var/lib/observa-spike0/otelcol, type: DirectoryOrCreate}
